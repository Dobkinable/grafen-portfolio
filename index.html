<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAFEN — Портфолио</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--text:#0f0f0f;--muted:#888;--border:rgba(0,0,0,.09);--fb:'Manrope',sans-serif}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}

nav{position:fixed;top:0;left:0;right:0;z-index:200;height:52px;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-bottom:.5px solid var(--border)}
.nav-logo{font-family:'Onest',sans-serif;font-size:12px;font-weight:400;letter-spacing:.18em;color:var(--text);text-decoration:none}
.nav-sub{font-size:11px;color:var(--muted);letter-spacing:.04em}

.hero{position:relative;height:100vh;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;width:100%;height:100%}

.hero-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:10}
.hero-word{font-family:'Onest',sans-serif;font-weight:400;font-size:clamp(64px,10vw,140px);letter-spacing:-.03em;color:#0f0f0f;line-height:1}

.scroll-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:10}
.scroll-hint-line{width:.5px;height:32px;background:linear-gradient(to bottom,transparent,#aaa)}
.scroll-hint-text{font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

.scroll-section{padding:5rem 2.5rem 4rem}
.section-label{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.grid-card{background:#fff;border-radius:10px;overflow:hidden;border:.5px solid var(--border);aspect-ratio:4/3;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}
.grid-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,.10)}
.grid-card img{width:100%;height:100%;object-fit:cover;display:block}

footer{padding:2rem 2.5rem;border-top:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ft-brand{font-family:'Onest',sans-serif;font-size:10px;letter-spacing:.2em;color:var(--muted)}
.ft-link{font-size:12px;color:var(--muted);text-decoration:none;transition:color .18s}
.ft-link:hover{color:var(--text)}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="#">GRAFEN</a>
  <span class="nav-sub">grafen.design</span>
</nav>

<section class="hero">
  <canvas id="stage"></canvas>
  <div class="hero-center">
    <div class="hero-word">GRAFEN</div>
  </div>
  <div class="scroll-hint">
    <span class="scroll-hint-text">scroll</span>
    <div class="scroll-hint-line"></div>
  </div>
</section>

<section class="scroll-section">
  <div class="section-label">Все работы</div>
  <div class="grid" id="grid"></div>
</section>

<footer>
  <span class="ft-brand">GRAFEN</span>
  <a class="ft-link" href="https://grafen.design" target="_blank">grafen.design</a>
</footer>

<script>
const BASE = 'https://raw.githubusercontent.com/Dobkinable/grafen-portfolio/main/';
const API  = 'https://api.github.com/repos/Dobkinable/grafen-portfolio/contents/';

const HERO_FILES = [
  '4starters.jpg','Annie Fire.jpg','Any Size.jpg','Belka shop.jpg',
  'COOPER HOUSE.jpg','Coffee Bar.jpg','Cup Crave.jpg','Cutronix.jpg',
  'DRIP STORE Logo.jpg','Dear Baby.jpg'
];

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){
  W = canvas.width  = canvas.offsetWidth;
  H = canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener('resize', resize);

const images = HERO_FILES.map(name => {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = BASE + encodeURIComponent(name);
  return img;
});

const N = HERO_FILES.length;

// Равномерное распределение по сфере — две горизонтальных «полосы»
// theta0 — начальный угол по горизонтали, phi — угол по вертикали
// Распределяем как строки: 4 сверху, 2 по центру, 4 снизу
const SPHERE_LAYOUT = [
  // phi (угол от верхнего полюса),  theta0 (начальный горизонтальный угол)
  {phi: Math.PI*0.25, theta0: 0},
  {phi: Math.PI*0.25, theta0: Math.PI*0.5},
  {phi: Math.PI*0.25, theta0: Math.PI},
  {phi: Math.PI*0.25, theta0: Math.PI*1.5},
  {phi: Math.PI*0.50, theta0: Math.PI*0.25},
  {phi: Math.PI*0.50, theta0: Math.PI*0.75},
  {phi: Math.PI*0.75, theta0: 0},
  {phi: Math.PI*0.75, theta0: Math.PI*0.5},
  {phi: Math.PI*0.75, theta0: Math.PI},
  {phi: Math.PI*0.75, theta0: Math.PI*1.5},
];

let scrollProgress = 0;
let rotY = 0; // текущий угол вращения

window.addEventListener('scroll', () => {
  const heroH = document.querySelector('.hero').offsetHeight;
  scrollProgress = Math.min(1, Math.max(0, window.scrollY / (heroH * 0.65)));
});

function easeIO(t){ return t<.5?2*t*t:-1+(4-2*t)*t; }
function lerp(a,b,t){ return a+(b-a)*t; }

// Карточная геометрия
const CW = 175, CH = 128;

function getGridPos(i, cols, gap){
  const col = i % cols;
  const row = Math.floor(i / cols);
  return { gx: col*(CW+gap), gy: row*(CH+gap) };
}

function drawCard(img, rx, ry, fw, fh){
  const br = 10;
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(rx, ry, fw, fh, br);
  ctx.clip();
  ctx.drawImage(img, rx, ry, fw, fh);
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,.08)';
  ctx.lineWidth = .5;
  ctx.beginPath();
  ctx.roundRect(rx, ry, fw, fh, br);
  ctx.stroke();
  ctx.restore();
}

function draw(){
  requestAnimationFrame(draw);

  ctx.clearRect(0, 0, W, H);

  // Вращаем медленно и равномерно
  rotY += 0.006;

  const sp = easeIO(scrollProgress);
  const cx = W / 2;
  const cy = H / 2;
  const R  = Math.min(W, H) * 0.38;
  const FOV = 650;

  // Грид параметры
  const cols = Math.max(2, Math.floor(W / (CW + 14)));
  const gap  = 14;
  const totalW = cols * CW + (cols-1) * gap;
  const gStartX = (W - totalW) / 2;
  const gStartY = (H - (Math.ceil(N/cols) * (CH+gap) - gap)) / 2;

  // Строим карточки
  const cards = SPHERE_LAYOUT.map((bp, i) => {
    const theta = bp.theta0 + rotY;
    const phi   = bp.phi;

    // 3D координаты на сфере
    const x3 = R * Math.sin(phi) * Math.cos(theta);
    const y3 = R * Math.cos(phi);
    const z3 = R * Math.sin(phi) * Math.sin(theta);

    // Перспективная проекция
    const zd    = z3 + FOV;
    const scale = FOV / zd;
    const sx    = cx + x3 * scale;
    const sy    = cy + y3 * scale;

    // Глубина 0..1 (1 = ближе к камере)
    const depth = (z3 + R) / (2 * R);

    // Масштаб карточки — плавно по глубине, диапазон 0.72..1.0
    const depthScale = lerp(0.72, 1.0, depth);

    // Грид позиция
    const { gx, gy } = getGridPos(i, cols, gap);
    const gridX = gStartX + gx + CW/2;
    const gridY = gStartY + gy + CH/2;

    // Интерполяция позиции
    const ix = lerp(sx, gridX, sp);
    const iy = lerp(sy, gridY, sp);

    // Интерполяция размера — на сфере: depthScale, в гриде: 1.0
    const finalScale = lerp(depthScale, 1.0, sp);
    const fw = CW * finalScale;
    const fh = CH * finalScale;

    return { ix, iy, fw, fh, depth, i };
  });

  // Painter's algorithm: дальние сначала
  cards.sort((a, b) => sp > 0.8 ? a.i - b.i : a.depth - b.depth);

  cards.forEach(({ ix, iy, fw, fh, i }) => {
    const img = images[i];
    if(!img.complete || !img.naturalWidth) return;
    drawCard(img, ix - fw/2, iy - fh/2, fw, fh);
  });
}

requestAnimationFrame(draw);

// Грид секция
async function loadGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '<p style="color:#aaa;font-size:13px;grid-column:1/-1">Загрузка...</p>';
  try {
    let files = [], page = 1;
    while(true){
      const res = await fetch(`${API}?per_page=100&page=${page}`);
      if(!res.ok) throw new Error(res.status);
      const data = await res.json();
      if(!data.length) break;
      files = files.concat(data);
      if(data.length < 100) break;
      page++;
    }
    const imgs = files.filter(f => /\.(jpg|jpeg|png|webp)$/i.test(f.name));
    grid.innerHTML = imgs.map(f => `
      <div class="grid-card">
        <img src="${BASE + encodeURIComponent(f.name)}"
             alt="${f.name.replace(/\.[^.]+$/,'')}" loading="lazy"/>
      </div>`).join('');
  } catch(e){
    grid.innerHTML = `<p style="color:#aaa;font-size:13px;grid-column:1/-1">Ошибка: ${e.message}</p>`;
  }
}
loadGrid();
</script>
</body>
</html>
